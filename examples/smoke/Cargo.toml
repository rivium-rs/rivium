[package]
name = "smoke"
version = "0.0.0"
description = "Platform smoke test: TLS (rustls with ring) and axum round trips on every target, for what services build on Rivium"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
axum = { workspace = true, features = ["tokio", "http1"] }
rustls = { workspace = true, features = ["ring", "std"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }

[lints]
workspace = true
