[package]
name = "smoke"
version = "0.0.0"
description = "Toolchain and platform smoke test for the CI baseline; replaced by the real examples"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
axum = { workspace = true, features = ["tokio", "http1"] }
rustls = { workspace = true, features = ["ring", "std"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "signal", "io-util", "sync"] }

[lints]
workspace = true
