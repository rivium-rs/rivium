[package]
name = "udp-echo"
version = "0.1.0"
description = "Example: a UDP echo service on Rivium's process host, with blocking reads, a periodic job and log export"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
rivium = { workspace = true, features = ["log-export"] }
serde = { workspace = true, features = ["std", "derive"] }
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

[dev-dependencies]
rivium-test.workspace = true
zip = { workspace = true, features = ["deflate-flate2"] }

[lints]
workspace = true
