# The release notes, rendered by git-cliff when a release runs: the GitHub release's body lists
# the commits on main since the previous tag, which are the pull requests' Conventional Commit
# titles, in four parts. Nothing is written by hand; preview the next release's notes with
# `git cliff --unreleased --tag v<version> --strip all`.

[changelog]
header = ""
body = """
{% for section in ["Added", "Changed", "Fixed", "Breaking"] %}
### {{ section }}
{% set entries = commits | filter(attribute="group", value=section) %}
{%- for commit in entries %}
- {% if commit.scope %}`{{ commit.scope }}`: {% endif %}{{ commit.message | upper_first }}
{%- endfor %}
{%- if entries | length == 0 %}
None.
{%- endif %}
{% endfor %}
### Platforms and upgrades

- How far each target is verified: \
[docs/platforms.md](https://github.com/rivium-rs/rivium/blob/{{ version }}/docs/platforms.md). \
A target without a recorded verification is unverified.
- Upgrade guidance, including repository-workflow changes that do not change the library API: \
[docs/upgrading.md](https://github.com/rivium-rs/rivium/blob/{{ version }}/docs/upgrading.md).
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
commit_preprocessors = [
    { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/rivium-rs/rivium/pull/${1}))" },
]
# What a consumer gets is the six public library crates: commits about anything else
# (CI, tests, examples, scripts, documentation, housekeeping) are left out.
commit_parsers = [
    { message = "^[a-z]+(\\([^)]*\\))?!:", group = "Breaking" },
    { footer = "^BREAKING[ -]CHANGE", group = "Breaking" },
    { message = "^feat(\\([^)]*\\))?:", group = "Added" },
    { message = "^fix(\\([^)]*\\))?:", group = "Fixed" },
    { message = "^(perf|refactor)(\\([^)]*\\))?:", group = "Changed" },
    { message = ".*", skip = true },
]
