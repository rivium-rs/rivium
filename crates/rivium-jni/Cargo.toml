[package]
name = "rivium-jni"
description = "JNI adapter for Rivium's embedded host: generated JNI_OnLoad and native methods"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
include = ["src/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]
keywords = ["jni", "android", "ffi", "service"]
categories = ["api-bindings"]

[dependencies]
jni.workspace = true
rivium.workspace = true

[target.'cfg(not(target_os = "android"))'.dev-dependencies]
test-app = { path = "../../test-app" }
tests-integration = { path = "../../tests-integration", features = ["jvm"] }

[lints]
workspace = true
