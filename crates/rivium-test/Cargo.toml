[package]
name = "rivium-test"
description = "Test support for Rivium services: scripted services, log capture, contract suites"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
include = ["build.rs", "src/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]
keywords = ["testing", "service", "lifecycle"]
categories = ["development-tools::testing"]

[dependencies]
rivium.workspace = true
serde_json = { workspace = true, features = ["std"] }
# test-util: consumers' tests can pause time to drive services through their timeouts.
tokio = { workspace = true, features = ["test-util", "time"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["std", "fmt", "json"] }

[lints]
workspace = true
