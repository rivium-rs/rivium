[package]
name = "rivium-test"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
include = ["/src/**", "/build.rs", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]
description = "Small public-contract testing tools for Rivium consumers"

[dependencies]
rivium = { workspace = true, features = ["rt"] }

tokio = { workspace = true, features = ["time", "macros", "test-util"] }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["std", "registry", "fmt"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
