[package]
name = "rivium"
description = "Service foundation: configuration, logging, service lifecycle and process/embedded hosts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
include = ["src/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]
keywords = ["service", "lifecycle", "shutdown", "logging", "config"]
categories = ["asynchronous", "config"]

[features]
# Log export: packs log files into a zip archive to download (`log::LogExporter`).
log-export = ["dep:zip"]

[dependencies]
rivium-error.workspace = true
flate2 = { workspace = true, features = ["rust_backend"] }
serde = { workspace = true, features = ["std", "derive"] }
serde_ignored.workspace = true
serde_path_to_error.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "signal", "sync", "time"] }
toml = { workspace = true, features = ["std", "parse", "display", "serde"] }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["std", "env-filter", "fmt", "json", "tracing-log"] }
zip = { workspace = true, optional = true, features = ["deflate-flate2"] }

[dev-dependencies]
log.workspace = true
# Without a version, so that publishing rivium does not wait for rivium-test, which depends on it.
rivium-test = { path = "../rivium-test" }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }

[[test]]
name = "export"
required-features = ["log-export"]

[lints]
workspace = true
