[package]
name = "rivium"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
include = ["/src/**", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]
description = "Owned services and explicit resource lifetimes on Tokio"
[features]
default = []
full = ["rt"]
task = ["dep:tokio", "dep:tokio-util", "tokio-util/rt"]
rt = ["task", "dep:tracing"]
[dependencies]
tokio = { workspace = true, optional = true, features = ["rt", "time", "sync", "macros"] }
tokio-util = { workspace = true, optional = true }
tracing = { workspace = true, optional = true, features = ["std"] }
[dev-dependencies]
rivium-test = { path = "../rivium-test" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
