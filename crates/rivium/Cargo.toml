[package]
name = "rivium"
description = "Service foundation: configuration, logging, service lifecycle and process/embedded hosts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
include = ["src/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]
keywords = ["service", "lifecycle", "shutdown", "logging", "config"]
