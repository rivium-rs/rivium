[package]
name = "rivium-util"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
include = ["/src/**", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]
description = "Configuration, bounded diagnostics and desired-state task tools"

[features]
default = []
full = ["config", "log-export", "task"]
config = [
    "dep:serde",
    "dep:toml",
    "dep:serde_ignored",
    "dep:serde_path_to_error",
    "dep:tokio",
]
log = [
    "dep:serde",
    "dep:serde_json",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:flate2",
]
log-export = ["log", "dep:zip"]
task = [
    "rivium/task",
    "dep:tokio",
    "dep:tokio-util",
    "tokio/rt",
    "tokio/time",
    "tokio/macros",
]

[dependencies]
rivium.workspace = true

serde = { workspace = true, optional = true, features = ["std", "derive"] }
serde_json = { workspace = true, optional = true, features = ["std"] }
toml = { workspace = true, optional = true, features = ["std", "serde", "parse", "display"] }
serde_ignored = { workspace = true, optional = true }
serde_path_to_error = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["sync"] }
tokio-util = { workspace = true, optional = true }
tracing = { workspace = true, optional = true, features = ["std"] }
tracing-subscriber = { workspace = true, optional = true, features = [
    "std",
    "registry",
    "env-filter",
    "fmt",
    "json",
    "ansi",
    "tracing-log",
] }
flate2 = { workspace = true, optional = true, features = ["rust_backend"] }
zip = { workspace = true, optional = true, features = ["deflate-flate2"] }

[dev-dependencies]
rivium-test.workspace = true

tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
