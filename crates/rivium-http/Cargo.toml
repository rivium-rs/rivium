[package]
name = "rivium-http"
description = "axum integration for Rivium: HTTP server service, status envelope, probes, access log"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
include = ["src/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]
keywords = ["axum", "http", "service"]
categories = ["web-programming::http-server"]

[dependencies]
rivium.workspace = true
axum = { workspace = true, features = ["tokio", "http1", "matched-path", "query"] }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
serde_path_to_error.workspace = true
tokio = { workspace = true, features = ["net", "time"] }
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["fs"] }
tracing.workspace = true
uuid = { workspace = true, features = ["std", "v7"] }

[lints]
workspace = true
