[package]
name = "rivium-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Bounded HTTP contracts and owned Axum listeners"
readme = "README.md"
include = ["/src/**", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[features]
default = []
contract = [
    "dep:tokio",
    "dep:futures-util",
    "dep:http-body",
    "dep:tracing",
    "dep:uuid",
    "axum/matched-path",
]
server = [
    "contract",
    "rivium/rt",
    "axum/tokio",
    "axum/http1",
    "tokio/net",
    "tokio/io-util",
    "dep:tower",
]
fs = ["dep:tower", "dep:tower-http", "tower-http/fs"]
full = ["server", "fs"]

[dependencies]
rivium.workspace = true

axum = { workspace = true, features = ["json", "query"] }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
futures-util = { workspace = true, optional = true, features = ["std"] }
http-body = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["time", "sync", "macros"] }
tower = { workspace = true, optional = true, features = ["util"] }
tower-http = { workspace = true, optional = true }
tracing = { workspace = true, optional = true, features = ["std"] }
uuid = { workspace = true, optional = true, features = ["std", "v7"] }

[dev-dependencies]
rivium-test = { path = "../rivium-test" }

tracing-subscriber = { workspace = true, features = ["std", "fmt", "registry"] }
# Synthetic TLS fixture only; the HTTP product leaves TLS to application adapters.
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }
futures-util = { workspace = true, features = ["std"] }
http-body.workspace = true
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "test-util",
] }
tower = { workspace = true, features = ["util"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
