name: glibc

# PRs reuse the linking/symbol check; manual runs also exercise the old userland.
# The expanded daily matrix can reuse this workflow without duplicating its build commands.
on:
  workflow_call:
    inputs:
      run-runtime:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      run-runtime:
        description: Run the basic suite in the CentOS userland
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  glibc:
    name: glibc 2.17 (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Install isolated, pinned link tools
        run: |
          python3 -m venv "$RUNNER_TEMP/glibc-tools"
          "$RUNNER_TEMP/glibc-tools/bin/pip" install cargo-zigbuild==0.23.4 ziglang==0.15.2
          echo "$RUNNER_TEMP/glibc-tools/bin" >> "$GITHUB_PATH"
      - name: Link and inspect application, JNI and test artifacts
        run: scripts/glibc.sh build
      - name: Run the basic suite in the pinned CentOS userland
        if: ${{ inputs.run-runtime }}
        run: scripts/glibc.sh run
