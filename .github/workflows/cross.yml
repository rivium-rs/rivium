name: cross

# Runs on pull requests and on main; branches get CI through their (draft) pull request. Pull
# requests that change documentation only skip every job but `changes`.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Superseded pull request runs are cancelled; every commit on main gets a complete run. A group
  # keeps at most one pending run, which a newer one replaces whatever cancel-in-progress says, so
  # on main each commit is a group of its own: commits merged in a row run side by side.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Keep in sync with scripts/local/common.sh. Images are pinned by digest in Cross.toml.
  CROSS_REV: 65fe72b0cdb1e7e0cc0652517498d4389cc8f5cf

jobs:
  # Pull requests only. The other jobs are skipped (and report "skipped") only when this job finds
  # that the pull request changes documentation only; they run when it is skipped (main, manual
  # runs) or fails.
  changes:
    name: cross/changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      docs-only: ${{ steps.diff.outputs.docs-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        name: Files changed since the merge base with the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          scripts/docs-only.sh "origin/$BASE_REF" "$HEAD_SHA" || status=$?
          case "$status" in
            0) echo "docs-only=true" >> "$GITHUB_OUTPUT" ;;
            1) echo "docs-only=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

  armv7:
    name: cross/armv7
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --target armv7-unknown-linux-gnueabihf && rustup default stable
      - uses: ./.github/actions/install-cross
        with:
          rev: ${{ env.CROSS_REV }}
      - name: Tests under qemu-user
        run: cross test --locked --workspace --target armv7-unknown-linux-gnueabihf
      - uses: ./.github/actions/setup-zigbuild
      - name: glibc 2.17 baseline build and check
        run: |
          cargo zigbuild --locked --release -p smoke -p udp-echo -p beacon-jni --target armv7-unknown-linux-gnueabihf.2.17
          out=target/armv7-unknown-linux-gnueabihf/release
          scripts/check-glibc.sh 2.17 "$out/smoke" "$out/udp-echo" "$out/libbeacon_jni.so"

  loongarch64:
    name: cross/loongarch64
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --target loongarch64-unknown-linux-gnu && rustup default stable
      - uses: ./.github/actions/install-cross
        with:
          rev: ${{ env.CROSS_REV }}
      - name: Tests under qemu-user
        run: cross test --locked --workspace --target loongarch64-unknown-linux-gnu
      - name: glibc 2.36 baseline (the image's sysroot)
        run: |
          cross build --locked --release -p smoke -p udp-echo -p beacon-jni --target loongarch64-unknown-linux-gnu
          out=target/loongarch64-unknown-linux-gnu/release
          scripts/check-glibc.sh 2.36 "$out/smoke" "$out/udp-echo" "$out/libbeacon_jni.so"

  glibc:
    name: cross/glibc
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --target aarch64-unknown-linux-gnu && rustup default stable
      - uses: ./.github/actions/setup-zigbuild
      - name: glibc 2.17 baseline builds and check
        run: |
          cargo zigbuild --locked --release -p smoke -p udp-echo -p beacon-jni \
            --target x86_64-unknown-linux-gnu.2.17 --target aarch64-unknown-linux-gnu.2.17
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            out=target/$target/release
            scripts/check-glibc.sh 2.17 "$out/smoke" "$out/udp-echo" "$out/libbeacon_jni.so"
          done
      - name: Planted violation (a build against the runner's glibc must fail the check)
        run: |
          cargo build --locked --release -p smoke
          if scripts/check-glibc.sh 2.17 target/release/smoke; then
            echo "::error::check-glibc.sh accepted a binary built against glibc $(ldd --version | head -n 1 | awk '{ print $NF }')"
            exit 1
          fi
      - name: Run the 2.17 builds on CentOS 7 (glibc 2.17)
        run: |
          # udp-echo runs and stops on SIGTERM; smoke runs its TLS and HTTP round trips. Planted
          # violation: a stop that times out (a blocking read of 10 s, a deadline of 1 s) must fail.
          docker run --rm -v "$PWD/target/x86_64-unknown-linux-gnu/release:/b:ro" -v "$PWD/scripts:/s:ro" centos:7 \
            sh -c '/b/smoke check && /s/check-stop.sh /b/udp-echo &&
              ! /s/check-stop.sh /b/udp-echo --set echo.read_timeout=10s --set lifecycle.stop_timeout=1s 2> /dev/null' 

  android:
    name: cross/android
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-24.04
    env:
      TARGET: aarch64-linux-android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --target aarch64-linux-android && rustup default stable
      - name: beacon-jni with the NDK (API 30 linker, 16 KB pages) and its alignment
        run: |
          ndk=$ANDROID_NDK_LATEST_HOME
          grep Pkg.Revision "$ndk/source.properties"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang"
          CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384" \
            cargo build --locked --release -p beacon-jni --target "$TARGET"
          scripts/check-align.sh 16384 "target/$TARGET/release/libbeacon_jni.so"
          # Planted violation: the same library linked for 4 KB pages must fail the check.
          CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=4096" \
            cargo build --locked --release -p beacon-jni --target "$TARGET" --target-dir target/plant-4k
          if scripts/check-align.sh 16384 "target/plant-4k/$TARGET/release/libbeacon_jni.so"; then
            echo "::error::check-align.sh accepted a library linked for 4 KB pages"
            exit 1
          fi
      - uses: ./.github/actions/install-cross
        with:
          rev: ${{ env.CROSS_REV }}
      - name: Non-JNI tests under the bionic runner
        run: cross test --locked --workspace --target "$TARGET"
