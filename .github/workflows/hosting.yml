name: hosting

# Runs on pull requests and on main; branches get CI through their (draft) pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  systemd:
    name: hosting/systemd
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo build --locked --release -p smoke
      - run: scripts/hosting/systemd.sh target/release/smoke
      - name: Planted violation (a service that exits 3 when stopped must fail the exit-status check)
        run: |
          # No pipe here: run steps use `bash -e` without pipefail, so `harness | tee` would hide the status.
          status=0
          scripts/hosting/systemd.sh target/release/smoke --stop-exit 3 > "$RUNNER_TEMP/plant.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/plant.log"
          if [ "$status" -eq 0 ]; then
            echo "::error::the systemd checks accepted a service that exits 3 when stopped"
            exit 1
          fi
          grep -q "^FAIL stopped run exited with status 0$" "$RUNNER_TEMP/plant.log"

  winsw:
    name: hosting/winsw
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal && rustup default stable-x86_64-pc-windows-gnu
      - run: cargo build --locked --release -p smoke
      - shell: pwsh
        run: scripts/hosting/winsw.ps1 -Binary target/release/smoke.exe
      - name: Planted violation (a service that exits 3 when stopped must fail the exit-code check)
        shell: pwsh
        run: |
          $out = scripts/hosting/winsw.ps1 -Binary target/release/smoke.exe -Codes 75 -ExtraArgs '--stop-exit 3'
          $out
          if ($LASTEXITCODE -eq 0) { throw 'the WinSW checks accepted a service that exits 3 when stopped' }
          if (-not ($out -match '^FAIL stopped run exited with code 0$')) { throw 'the exit-code check did not fail' }
          $global:LASTEXITCODE = 0

  launchd:
    name: hosting/launchd
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo build --locked --release -p smoke
      - run: scripts/hosting/launchd.sh target/release/smoke
      - name: Planted violation (a service that exits 3 when stopped must fail the exit-code check)
        run: |
          # No pipe here: run steps use `bash -e` without pipefail, so `harness | tee` would hide the status.
          status=0
          scripts/hosting/launchd.sh target/release/smoke --stop-exit 3 > "$RUNNER_TEMP/plant.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/plant.log"
          if [ "$status" -eq 0 ]; then
            echo "::error::the launchd checks accepted a service that exits 3 when stopped"
            exit 1
          fi
          grep -q "^FAIL last exit code is 0$" "$RUNNER_TEMP/plant.log"
