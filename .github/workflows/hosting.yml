name: hosting

# Runs on pull requests and on main; branches get CI through their (draft) pull request. Pull
# requests that change documentation only skip every job but `changes`.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release runs it at the commit it releases.
  workflow_call:

permissions:
  contents: read

concurrency:
  # Called by the release, github.workflow is the release's name: the group stays apart from
  # both the release's and this workflow's own runs.
  group: hosting-${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request runs are cancelled; every commit on main gets a complete run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Pull requests only. The other jobs are skipped (and report "skipped") only when this job finds
  # that the pull request changes documentation only; they run when it is skipped (main, manual
  # runs) or fails.
  changes:
    name: hosting/changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      docs-only: ${{ steps.diff.outputs.docs-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        name: Files changed since the merge base with the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          scripts/docs-only.sh "origin/$BASE_REF" "$HEAD_SHA" || status=$?
          case "$status" in
            0) echo "docs-only=true" >> "$GITHUB_OUTPUT" ;;
            1) echo "docs-only=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

  systemd:
    name: hosting/systemd
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo build --locked --release -p udp-echo
      - run: scripts/hosting/systemd.sh target/release/udp-echo
      - name: Planted violation (a service that outlives its stop deadline must fail the exit-status check)
        run: |
          # No pipe here: run steps use `bash -e` without pipefail, so `harness | tee` would hide the status.
          # A blocking read of 10 s against a stop deadline of 1 s: the stop times out with 124.
          status=0
          scripts/hosting/systemd.sh target/release/udp-echo --set echo.read_timeout=10s --set lifecycle.stop_timeout=1s > "$RUNNER_TEMP/plant.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/plant.log"
          if [ "$status" -eq 0 ]; then
            echo "::error::the systemd checks accepted a service whose stop timed out"
            exit 1
          fi
          grep -q "^FAIL stopped run exited with status 0$" "$RUNNER_TEMP/plant.log"

  winsw:
    name: hosting/winsw
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal && rustup default stable-x86_64-pc-windows-gnu
      - run: cargo build --locked --release -p udp-echo
      - shell: pwsh
        run: scripts/hosting/winsw.ps1 -Binary target/release/udp-echo.exe -Faults target/release/udp-echo-faults.exe
      - name: Planted violation (a service that outlives its stop deadline must fail the exit-code check)
        shell: pwsh
        run: |
          # A blocking read of 10 s against a stop deadline of 1 s: the stop times out with 124.
          $out = scripts/hosting/winsw.ps1 -Binary target/release/udp-echo.exe -Faults target/release/udp-echo-faults.exe `
            -Scenarios restart -ExtraArgs '--set echo.read_timeout=10s --set lifecycle.stop_timeout=1s'
          $out
          if ($LASTEXITCODE -eq 0) { throw 'the WinSW checks accepted a service whose stop timed out' }
          if (-not ($out -match '^FAIL stopped run exited with code 0$')) { throw 'the exit-code check did not fail' }
          $global:LASTEXITCODE = 0

  launchd:
    name: hosting/launchd
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo build --locked --release -p udp-echo
      - run: scripts/hosting/launchd.sh target/release/udp-echo
      - name: Planted violation (a service that outlives its stop deadline must fail the exit-code check)
        run: |
          # No pipe here: run steps use `bash -e` without pipefail, so `harness | tee` would hide the status.
          # A blocking read of 10 s against a stop deadline of 1 s: the stop times out with 124.
          status=0
          scripts/hosting/launchd.sh target/release/udp-echo --set echo.read_timeout=10s --set lifecycle.stop_timeout=1s > "$RUNNER_TEMP/plant.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/plant.log"
          if [ "$status" -eq 0 ]; then
            echo "::error::the launchd checks accepted a service whose stop timed out"
            exit 1
          fi
          grep -q "^FAIL last exit code is 0$" "$RUNNER_TEMP/plant.log"
