name: ci

# The minimal CI while the verification is rebuilt: formatting, clippy, cargo-deny and the script
# self-tests; the workspace tests on Linux, macOS and Windows (GNU); the tests on the MSRV. Runs on
# pull requests and on main; branches get CI through their (draft) pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Superseded pull request runs are cancelled; every commit on main gets a complete run. A group
  # keeps at most one pending run, which a newer one replaces whatever cancel-in-progress says, so
  # on main each commit is a group of its own: commits merged in a row run side by side.
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    name: ci/lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny@0.20.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo deny --locked check
      - name: Lint the scripts and run their self-tests (planted violations)
        run: |
          shellcheck scripts/*.sh scripts/hooks/* scripts/tests/*.sh crates/rivium-jni/tests/jvm/run.sh
          scripts/tests/check-public.sh
          scripts/tests/check-commit-msg.sh

  test:
    name: ci/test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-24.04, toolchain: stable }
          - { name: macos, os: macos-latest, toolchain: stable }
          - { name: windows-gnu, os: windows-latest, toolchain: stable-x86_64-pc-windows-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal && rustup default ${{ matrix.toolchain }}
      - run: cargo test --workspace --locked

  msrv:
    name: ci/msrv
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.92 --profile minimal
      - run: cargo +1.92 test --workspace --all-features --locked
