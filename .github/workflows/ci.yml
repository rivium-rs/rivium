name: ci

# Runs on pull requests and on main; branches get CI through their (draft) pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request runs are cancelled; every commit on main gets a complete run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    name: ci/lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny@0.20.2,cargo-hack@0.6.45
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo deny --locked check
      - run: cargo hack check --each-feature --workspace --locked
      - name: Lint scripts and run their self-tests (planted violations)
        run: |
          shellcheck scripts/*.sh scripts/hooks/* scripts/tests/*.sh scripts/local/*.sh scripts/hosting/*.sh
          scripts/tests/check-public.sh
          scripts/tests/check-commit-msg.sh

  test-linux:
    name: ci/test-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo test --workspace --locked
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Desktop JVM contract (JNI smoke cdylib, including a planted signature mismatch)
        run: |
          cargo build --locked -p smoke-jni
          examples/smoke-jni/jvm/run.sh target/debug

  test-linux-arm64:
    name: ci/test-linux-arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          if ! command -v rustup > /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo test --workspace --locked

  test-macos:
    name: ci/test-macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo test --workspace --locked

  test-windows-gnu:
    name: ci/test-windows-gnu
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal && rustup default stable-x86_64-pc-windows-gnu
      - name: Toolchain report
        shell: bash
        run: |
          rustc -vV
          for tool in gcc x86_64-w64-mingw32-gcc; do
            printf '%s: ' "$tool"; command -v "$tool" || echo "(not on PATH)"
          done
          gcc --version 2> /dev/null | head -n 1 || true
      - run: cargo test --workspace --locked

  msrv:
    name: ci/msrv
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.92 --profile minimal
      - run: cargo +1.92 test --workspace --all-features --locked

  semver:
    name: ci/semver
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-semver-checks@0.51.0
      - name: API compatibility report (does not block before 0.1.0)
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Baseline: the PR base, else the previous tip of the pushed branch, else main.
          if [ -n "$BASE_REF" ]; then
            base=$(git merge-base HEAD "origin/$BASE_REF")
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2> /dev/null; then
            base=$BEFORE
          else
            base=$(git merge-base HEAD origin/main)
          fi
          echo "baseline: $base"
          status=0
          for crate in rivium-error rivium rivium-http rivium-jni rivium-test; do
            if git cat-file -e "$base:crates/$crate/Cargo.toml" 2> /dev/null; then
              cargo semver-checks -p "$crate" --baseline-rev "$base" || status=1
            else
              echo "::notice::$crate has no baseline at $base; skipped"
            fi
          done
          exit "$status"

  template:
    name: ci/template
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-generate@0.25.0
      - run: scripts/template-smoke.sh "$RUNNER_TEMP"
