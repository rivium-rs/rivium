name: release

# Manual runs are always previews. Only a version-tag push can request a protected publication.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serialize irreversible registry writes, without letting a preview cancel a publication.
  group: release-${{ github.event_name == 'push' && 'publish' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: release/check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # inspect the environment's protection, not change it
    outputs:
      rust: ${{ steps.prepare.outputs.rust }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: git-cliff@2.14.2
      - name: Validate source, version, baseline and generated notes
        id: prepare
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" = push ]; then
            scripts/release-check.sh tag "$TAG" "$RUNNER_TEMP/release"
            gh api "repos/$GITHUB_REPOSITORY/environments/crates-io" > "$RUNNER_TEMP/environment.json"
            scripts/release-check.sh environment "$RUNNER_TEMP/environment.json"
          else
            scripts/release-check.sh preview "$RUNNER_TEMP/release"
          fi
          jq -r '"rust=" + .rust' "$RUNNER_TEMP/release/release.json" >> "$GITHUB_OUTPUT"
      - name: Package the six public crates without executing build scripts
        run: cargo package -p rivium -p rivium-util -p rivium-host -p rivium-http -p rivium-jni -p rivium-test --all-features --locked --registry crates-io --no-verify --target-dir "$RUNNER_TEMP/release/build"
      - name: Scan the actual archives and notes before any dependency verification runs
        env:
          PUBLIC_DENYLIST: ${{ secrets.PUBLIC_DENYLIST }}
        run: |
          test -n "$PUBLIC_DENYLIST"
          list="$RUNNER_TEMP/release-denylist"
          trap 'rm -f "$list"' EXIT
          printf '%s\n' "$PUBLIC_DENYLIST" > "$list"
          scripts/release-packages.sh scan "$RUNNER_TEMP/release/build/package" "$RUNNER_TEMP/release" "$list" "$RUNNER_TEMP/verified-release"
      - name: Verify publishing without uploading, then confirm the scanned bytes are unchanged
        run: |
          cargo publish --dry-run --workspace --all-features --locked --registry crates-io --target-dir "$RUNNER_TEMP/release/build"
          scripts/release-packages.sh verify "$RUNNER_TEMP/release/build/package" "$RUNNER_TEMP/release" "$RUNNER_TEMP/verified-release"
          cat "$RUNNER_TEMP/release/notes.md" >> "$GITHUB_STEP_SUMMARY"
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release
          path: ${{ runner.temp }}/verified-release/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  semver:
    name: release/semver
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-semver-checks@0.51.0
      - name: Check the four continuing public APIs against crates.io
        run: |
          before=$(git hash-object Cargo.lock)
          # This plugin has no --locked flag. Normal Cargo commands stay locked, and this input must not change.
          cargo semver-checks check-release -p rivium -p rivium-http -p rivium-jni -p rivium-test --all-features
          test "$(git hash-object Cargo.lock)" = "$before"

  public:
    uses: ./.github/workflows/public.yml
    secrets: inherit
  ci:
    uses: ./.github/workflows/ci.yml
  daily:
    uses: ./.github/workflows/daily.yml
  loom:
    uses: ./.github/workflows/loom.yml

  ready:
    name: release/ready
    if: ${{ always() }}
    needs: [check, semver, public, ci, daily, loom]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: scripts/check-ci.sh "$NEEDS_JSON"

  publish:
    name: release/publish
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'rivium-rs/rivium' }}
    needs: [check, ready]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: write # create the GitHub Release only after registry verification
      id-token: write # only this reviewed job can request publishing credentials
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Use the same Rust/Cargo version as the verified packages
        env:
          BUILD_RUST: ${{ needs.check.outputs.rust }}
        run: rustup toolchain install "$BUILD_RUST" --profile minimal && rustup default "$BUILD_RUST"
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: git-cliff@2.14.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.check.outputs.artifact-id }}
          path: ${{ runner.temp }}/verified-release
          merge-multiple: true
      - name: Recheck the tag and approved bytes without running dependency build scripts
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/environments/crates-io" > "$RUNNER_TEMP/environment.json"
          scripts/release-check.sh environment "$RUNNER_TEMP/environment.json"
          scripts/release-check.sh tag "$TAG" "$RUNNER_TEMP/release"
          cargo package -p rivium -p rivium-util -p rivium-host -p rivium-http -p rivium-jni -p rivium-test --all-features --locked --registry crates-io --no-verify --target-dir "$RUNNER_TEMP/release/build"
          scripts/release-packages.sh verify "$RUNNER_TEMP/release/build/package" "$RUNNER_TEMP/release" "$RUNNER_TEMP/verified-release"
      - id: auth
        if: ${{ github.ref != 'refs/tags/v0.2.0' }}
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: First publication of the verified 0.2.0 workspace
        if: ${{ github.ref == 'refs/tags/v0.2.0' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CARGO_NET_RETRY: 0
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo 'release: configure the first-publication token in the protected crates-io environment' >&2
            exit 1
          fi
          cargo publish --workspace --all-features --locked --registry crates-io --no-verify --target-dir "$RUNNER_TEMP/release/build"
      - name: Publish subsequent versions using Trusted Publishing
        if: ${{ github.ref != 'refs/tags/v0.2.0' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          CARGO_NET_RETRY: 0
        # --no-verify avoids executing dependency code with OIDC permission; the identical archives passed verification above.
        run: cargo publish --workspace --all-features --locked --registry crates-io --no-verify --target-dir "$RUNNER_TEMP/release/build"
      - name: Read back registry checksums before announcing the release
        run: |
          version=$(jq -r .version "$RUNNER_TEMP/release/release.json")
          scripts/release-registry.sh published "$version" "$RUNNER_TEMP/verified-release"
      - name: Create the GitHub Release using the verified notes file
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/verified-release/notes.md"
          gh release view "$TAG" --json tagName,name,isDraft,isPrerelease,body > "$RUNNER_TEMP/github-release.json"
          jq -e --arg tag "$TAG" --rawfile notes "$RUNNER_TEMP/verified-release/notes.md" \
            '.tagName == $tag and .name == $tag and .isDraft == false and .isPrerelease == false and .body == $notes' \
            "$RUNNER_TEMP/github-release.json" > /dev/null
