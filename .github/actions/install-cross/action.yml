name: Install cross
description: Installs cross at a pinned git revision (cached); loongarch64 support is not in a crates.io release.
inputs:
  rev:
    description: cross git revision
    required: true
runs:
  using: composite
  steps:
    - id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/bin/cross
          ~/.cargo/bin/cross-util
        key: cross-${{ runner.os }}-${{ runner.arch }}-${{ inputs.rev }}
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        REV: ${{ inputs.rev }}
      run: cargo install cross --git https://github.com/cross-rs/cross --rev "$REV" --locked
    - shell: bash
      run: cross --version
