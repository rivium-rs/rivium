# cross images, pinned by digest so CI and local runs use the same toolchains and sysroots.
# The cross CLI itself is pinned to a git revision in .github/workflows/cross.yml (loongarch64
# support is not in a crates.io release of cross).

[target.armv7-unknown-linux-gnueabihf]
image = "ghcr.io/cross-rs/armv7-unknown-linux-gnueabihf@sha256:c2c22377c0df78c59e58e51cc72d77920e6b57a787cc867213b8473f1978188a"

[target.loongarch64-unknown-linux-gnu]
# Sysroot glibc 2.36, the loongarch64 (new world) baseline.
image = "ghcr.io/cross-rs/loongarch64-unknown-linux-gnu@sha256:83a642c323821e3c1110107355ad14d11528f956f117c78b7820e2e38b23538b"

[target.aarch64-linux-android]
image = "ghcr.io/cross-rs/aarch64-linux-android@sha256:2c8b8d97bfd7b0079679973085c69ce30741093f675565eb47eb15c2d59f6336"

[target.x86_64-pc-windows-gnu]
image = "ghcr.io/cross-rs/x86_64-pc-windows-gnu@sha256:3953503d235a4553b2c815a1a9077b9ad87570c0185cbf312a5d131230ebe7ce"
