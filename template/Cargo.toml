[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Rivium's MSRV, which the native LoongArch old-world toolchain dictates.
rust-version = "1.92"
publish = false

[workspace.dependencies]
# Rivium's crates are released together: keep them at one version. `cargo update` takes their
# fixes; a new minor version (breaking in 0.x) comes with Rivium's upgrading guide.
rivium = "0.1"{% if http %}
rivium-http = "0.1"{% endif %}{% if jni %}
rivium-jni = "0.1"{% endif %}
rivium-test = "0.1"
{% if http %}axum = { version = "0.8", default-features = false }
{% endif %}serde = { version = "1", features = ["derive"] }
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# Every profile keeps panic = "unwind", the default: Rivium turns a panic into a service
# failure{% if jni %}, or into a result code at the JNI boundary{% endif %}, which panic = "abort" makes
# impossible (scripts/check-panic.sh).
