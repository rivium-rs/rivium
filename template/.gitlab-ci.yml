# CI of {{project-name}} for GitLab. Generic: set the images and runner tags that your GitLab
# provides. The jobs run the same `just` recipes as a developer.

stages: [check, package]

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo-home"

default:
  # Rust 1.92 or later, with just and cargo-deny{% if jni %} (and a JDK 17 for `jvm`){% endif %}.
  image: "$RUST_IMAGE"
  cache:
    key: cargo
    paths: [.cargo-home/registry, target]
  # The jobs build with the committed Cargo.lock, which `just lockfile` creates, so that a
  # release is built from the dependencies that were tested.
  before_script:
    - test -f Cargo.lock || (echo "Cargo.lock is not committed; run just lockfile and commit it" >&2; exit 1)

check:
  stage: check
  script:
    - just check
    - just check-variants
{% if jni %}
jvm:
  stage: check
  script:
    - just jvm
{% endif %}
# Archives for the installer on tags: dist/<component>/<platform>/<version>/. Needs zig and
# cargo-zigbuild for Linux and Windows, and cross with Docker for linux_loong64.
package:
  stage: package
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - just package {{ platforms | remove: "darwin_arm64" | strip }}
  artifacts:
    paths: [dist/]
{% if platforms contains "darwin_arm64" %}
# darwin_arm64 builds on a macOS runner.
package-macos:
  stage: package
  rules:
    - if: $CI_COMMIT_TAG
  tags: [<your macOS runner>]
  script:
    - just package darwin_arm64
  artifacts:
    paths: [dist/]
{% endif %}
# LoongArch old-world ABI (1.0): the upstream target cannot build for it. Build and test on a
# native runner with the vendor's ABI 1.0 Rust toolchain, then check the binary: ELF flags 0x3,
# interpreter /lib64/ld.so.1, glibc 2.28 at most.
# loongarch-old-world:
#   stage: package
#   tags: [<your native LoongArch runner>]
#   script:
#     - export PATH=<the toolchain's directory>/bin:$PATH
#     - cargo test --locked
#     - cargo build --locked --release -p {{project-name}}-bin
