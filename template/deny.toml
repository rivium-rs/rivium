# cargo-deny policy (`just check`). No C or C++ build chain beyond `cc`, which ring needs: TLS
# uses rustls with the ring provider, never aws-lc or OpenSSL (see AGENTS.md).

[advisories]
yanked = "deny"

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
]
confidence-threshold = 0.9
# The project's own packages are not published.
private = { ignore = true }

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { crate = "aws-lc-rs", reason = "TLS uses rustls with the ring provider" },
    { crate = "aws-lc-sys", reason = "TLS uses rustls with the ring provider" },
    { crate = "openssl", reason = "TLS uses rustls with the ring provider" },
    { crate = "openssl-sys", reason = "TLS uses rustls with the ring provider" },
    { crate = "cmake", reason = "no CMake build chain" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
