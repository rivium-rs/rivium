{% if http %}[http]
addr = "127.0.0.1:8080"
request_timeout = "30s"
body_limit = "1MiB"
expose_internal_detail = false
probes = true

{% endif %}[heartbeat]
every = "1m"

[log]
filter = "info"
files = []

[log.console]
filter = ""
format = "text"

[log.file]
dir = "logs/{{project-name}}"
filter = ""
max_file_size = "16MiB"
max_total_size = "256MiB"

[log.logcat]
filter = "warn"

[lifecycle]
startup_timeout = "30s"
stop_timeout = "3s"
restart = "exit"
instance = ""
