[package]
name = "{{project-name}}-jni"
description = "{{project-name}} inside an Android app: its JNI library, through rivium-jni"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
{{project-name}} = { path = "../{{project-name}}" }
rivium-jni.workspace = true

[lints]
workspace = true
