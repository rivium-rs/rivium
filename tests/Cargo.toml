[workspace]
resolver = "3"
members = ["host-app", "host-bin"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.92"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rivium = { path = "../crates/rivium", default-features = false }
rivium-test = { path = "../crates/rivium-test", default-features = false }
rivium-verify-app = { path = "host-app", default-features = false }
serde = { version = "1.0.219", default-features = false, features = ["std", "derive"] }
tokio = { version = "1.47", default-features = false, features = ["net", "io-util", "sync", "time", "macros"] }
tracing = { version = "0.1.41", default-features = false, features = ["std"] }
serde_json = { version = "1.0.140", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
