[workspace]
resolver = "3"
members = [
    "crates/rivium", "crates/rivium-util", "crates/rivium-host",
    "crates/rivium-http", "crates/rivium-jni", "crates/rivium-test",
    "tests-build", "tests-integration", "tests-integration/test-app",
    "tests-integration/jni", "examples", "benches",
]
exclude = ["tests-loom"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rivium-rs/rivium"

[workspace.dependencies]
rivium = { path = "crates/rivium", version = "0.2.0", default-features = false }
rivium-util = { path = "crates/rivium-util", version = "0.2.0", default-features = false }
rivium-host = { path = "crates/rivium-host", version = "0.2.0", default-features = false }
rivium-http = { path = "crates/rivium-http", version = "0.2.0", default-features = false }
rivium-jni = { path = "crates/rivium-jni", version = "0.2.0" }
rivium-test = { path = "crates/rivium-test", version = "0.2.0" }
axum = { version = "0.8.9", default-features = false }
flate2 = { version = "1.1", default-features = false }
futures-util = { version = "0.3", default-features = false }
http-body = { version = "1", default-features = false }
jni = { version = "0.22.4", default-features = false }
serde = { version = "1", default-features = false }
serde_ignored = { version = "0.1", default-features = false }
serde_json = { version = "1.0.154", default-features = false }
serde_path_to_error = { version = "0.1", default-features = false }
tokio = { version = "1.53.3", default-features = false }
tokio-util = { version = "0.7.20", default-features = false }
tokio-rustls = { version = "0.26.6", default-features = false }
toml = { version = "1.1.8", default-features = false }
tower = { version = "0.5.3", default-features = false }
tower-http = { version = "0.7.1", default-features = false }
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false }
uuid = { version = "1.28.0", default-features = false }
zip = { version = "9.0.3", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rivium_jni_fault)", "cfg(qemu)", "cfg(docsrs)", "cfg(rivium_scope_model)"] }

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
