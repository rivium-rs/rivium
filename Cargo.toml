[workspace]
resolver = "3"
members = [
    "crates/*",
    "examples/embedded/*",
    "examples/http-api",
    "examples/multi-bin",
    "examples/slices/*/*",
    "examples/smoke",
    "examples/udp-echo",
    "fixtures/jni-forbid",
    "fixtures/minimal",
]
exclude = ["template"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# MSRV is a platform commitment: do not raise it without the maintainer's approval.
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rivium-rs/rivium"

[workspace.dependencies]
# All Rivium crates share one version and are released together.
rivium-error = { path = "crates/rivium-error", version = "0.1.0" }
rivium = { path = "crates/rivium", version = "0.1.0" }
rivium-http = { path = "crates/rivium-http", version = "0.1.0" }
rivium-jni = { path = "crates/rivium-jni", version = "0.1.0" }
rivium-test = { path = "crates/rivium-test", version = "0.1.0" }

# Third-party crates: default features are always off; members enable what they use.
axum = { version = "0.8", default-features = false }
flate2 = { version = "1.1", default-features = false }
jni = { version = "0.22.4", default-features = false }
log = { version = "0.4.22", default-features = false }
nu-ansi-term = { version = "0.50", default-features = false }
rustls = { version = "0.23", default-features = false }
serde = { version = "1.0.219", default-features = false }
serde_ignored = { version = "0.1.12", default-features = false }
serde_path_to_error = { version = "0.1.17", default-features = false }
serde_json = { version = "1.0.140", default-features = false }
tokio = { version = "1.47", default-features = false }
toml = { version = "1.1.0", default-features = false }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.7", default-features = false }
tracing = { version = "0.1.41", default-features = false }
tracing-subscriber = { version = "0.3.20", default-features = false }
uuid = { version = "1.18", default-features = false }
zip = { version = "8.6", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
# Set only by test builds of rivium-jni that inject panics into its native methods.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rivium_jni_fault)"] }
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"

# Every profile keeps the default `panic = "unwind"`: hosts turn panics into service failures and
# FFI result codes, which `panic = "abort"` would make impossible.
