[package]
name = "test-app"
version = "0.0.0"
edition = "2021"
rust-version = "1.92.0"
publish = false
license = "MIT OR Apache-2.0"
description = "Test programs for Rivium integration tests"

[dependencies]
rivium = { path = "../crates/rivium" }
serde = { workspace = true, features = ["derive"] }
async-trait = "0.1"

[lib]
path = "src/lib.rs"

# Each binary is a minimal wrapper around a subject module.
# The subjects live in src/subjects/ and are tested via tests-integration.

[[bin]]
name = "host"
path = "src/bin/host.rs"

[[bin]]
name = "host-sigint"
path = "src/bin/host_sigint.rs"

[[bin]]
name = "host-sigquit"
path = "src/bin/host_sigquit.rs"

[[bin]]
name = "host-second-signal"
path = "src/bin/host_second_signal.rs"

[[bin]]
name = "host-deadline"
path = "src/bin/host_deadline.rs"

[[bin]]
name = "host-fault-ready"
path = "src/bin/host_fault_ready.rs"

[[bin]]
name = "host-fault-run"
path = "src/bin/host_fault_run.rs"

[[bin]]
name = "host-fault-build"
path = "src/bin/host_fault_build.rs"

[[bin]]
name = "host-args"
path = "src/bin/host_args.rs"

[[bin]]
name = "host-export"
path = "src/bin/host_export.rs"

[[bin]]
name = "host-notify"
path = "src/bin/host_notify.rs"

[lints]
workspace = true
